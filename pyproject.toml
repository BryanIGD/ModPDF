[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modpdf"
version = "0.1.0"
description = "Split, merge, reorder and compress PDFs entirely on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ModPDF contributors" }]
keywords = ["pdf", "privacy", "offline", "split", "merge", "compress"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# Six dependencies, each load-bearing. See docs/adr/ before adding a seventh.
dependencies = [
    "pikepdf>=9.4",     # QPDF bindings: the PDF object model
    "pypdfium2>=4.30",  # page rendering, for the compression quality gate
    "pillow>=11.0",     # image decode / resample / encode
    "typer>=0.15",      # CLI
    "rich>=13.9",       # reports and progress
    # The compression quality gate's pixel-difference statistic. Capped below
    # 2.5: numpy 2.5 dropped Python 3.11 and its bundled .pyi stubs use PEP
    # 695 `type` syntax mypy refuses to parse under this project's floor
    # (python_version = "3.11" in [tool.mypy], set to the minimum we support,
    # not to whatever a dependency's stubs happen to require) — a packaging
    # mismatch between numpy and mypy, not a real 3.11 incompatibility.
    "numpy>=2.4.6,<2.5",
]

# The desktop app is an optional extra. The core stays at five dependencies;
# someone who only wants the command line does not install a GUI toolkit.
# PySide6 is LGPL-3.0, which Apache-2.0 can depend on but not vendor, so it is
# never bundled — `pip install modpdf[gui]` pulls it from PyPI.
[project.optional-dependencies]
gui = ["PySide6>=6.8"]

[project.scripts]
modpdf = "modpdf.cli:main"
modpdf-gui = "modpdf.gui.app:main"

[dependency-groups]
dev = [
    "PySide6>=6.8",     # so the GUI is type checked and tested in CI
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "mypy>=1.14",
    "ruff>=0.9",
    "reportlab>=4.2",   # generates test PDFs so no real document is ever committed
    "pip-audit>=2.7",
    "bandit>=1.8",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modpdf"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # shadowed builtins
    "C4",       # comprehensions
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
    "S",        # bandit-style security checks
]
ignore = [
    "S101",  # assert is fine in tests, and we use it as an invariant marker
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]
# Qt's event handlers are camelCase by definition; overriding them correctly
# means matching the names Qt calls.
"src/modpdf/gui/**" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These ship incomplete or absent type information.
module = ["pikepdf.*", "pypdfium2.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: takes more than a second (deselect with '-m \"not slow\"')",
    "corpus: requires the downloaded test corpus",
]

[tool.coverage.run]
source = ["src/modpdf"]
branch = true
